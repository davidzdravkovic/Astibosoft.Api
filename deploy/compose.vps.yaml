# Astibosoft on shared VPS infra
# Requires external Docker networks: edge, database
# and a postgres service reachable as hostname "postgres" on database.
#
# Infra nginx proxies https://astibosoft.com/api/ → http://astibosoft-api:8080
# Ai is localhost-only for CLI embed:
#   curl -X POST http://127.0.0.1:8090/internal/embed ...

name: astibosoft-vps

services:
  db-init:
    image: postgres:17-alpine
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-astibosoft}
    volumes:
      - ./docker-init.sh:/docker-init.sh:ro
    command: ["sh", "/docker-init.sh"]
    networks: [database]

  astibosoft-ai:
    build:
      context: ${ASTIBOSOFT_AI_CONTEXT:-../../Astibosoft.Ai}
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AI_HOST_PORT:-8090}:8090"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-astibosoft}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      RAG_INTERNAL_KEY: ${AI_INTERNAL_KEY}
      AI_EMBED_ON_START: ${AI_EMBED_ON_START:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks: [database]

  astibosoft-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-astibosoft};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Database__AutoMigrate: "true"
      Allowed_Cors__0: ${PUBLIC_ORIGIN:-}
      Ai__BaseUrl: ${AI_BASE_URL:-http://astibosoft-ai:8090}
      Ai__InternalKey: ${AI_INTERNAL_KEY}
      Ai__TimeoutSeconds: ${AI_TIMEOUT_SECONDS:-60}
      Jwt__Issuer: Astibosoft
      Jwt__Audience: Astibosoft
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-480}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Founders__Founder1__Email: ${FOUNDER1_EMAIL}
      Founders__Founder1__Password: ${FOUNDER1_PASSWORD}
      Founders__Founder1__Name: ${FOUNDER1_NAME:-}
      Founders__Founder2__Email: ${FOUNDER2_EMAIL}
      Founders__Founder2__Password: ${FOUNDER2_PASSWORD}
      Founders__Founder2__Name: ${FOUNDER2_NAME:-}
    depends_on:
      db-init:
        condition: service_completed_successfully
      astibosoft-ai:
        condition: service_started
    networks: [edge, database]

networks:
  edge:
    external: true
    name: edge
  database:
    external: true
    name: database
