name: asibosoft-api

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asibosoft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asibosoft}
      POSTGRES_DB: ${POSTGRES_DB:-asibosoft}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - asibosoft_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asibosoft} -d ${POSTGRES_DB:-asibosoft}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-asibosoft};Username=${POSTGRES_USER:-asibosoft};Password=${POSTGRES_PASSWORD:-asibosoft}
      Database__AutoMigrate: "true"
      Allowed_Cors__0: ${PUBLIC_ORIGIN:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy

volumes:
  asibosoft_pg:
